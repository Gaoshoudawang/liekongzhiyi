<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奖励一览</title>
<script src="../data/gacha_base.js"></script>
  <script src="../data/item_base_name_map.js"></script>
  <script src="../data/bonus_extra.js"></script>
  <script src="../data/item_box_config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* 滚动容器 */
.scroll-container{position:absolute;top:120px;left:80px;right:80px;bottom:80px;overflow-y:auto;overflow-x:hidden;padding:20px;z-index:10}
.scroll-container::-webkit-scrollbar{width:12px}
.scroll-container::-webkit-scrollbar-track{background:rgba(0,0,0,0.3);border-radius:6px}
.scroll-container::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.6);border-radius:6px}
/* 品质标题 */
.quality-title{width:100%;font-size:42px;font-weight:bold;margin:40px 0 30px 0;padding-left:20px;border-left:8px solid}
.quality-title.red{color:#ff4444;text-shadow:0 0 10px rgba(255,68,68,0.8);border-left-color:#ff4444}
.quality-title.gold{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,0.8);border-left-color:#ffd700}
.quality-title.purple{color:#c77dff;text-shadow:0 0 10px rgba(199,125,255,0.8);border-left-color:#c77dff}
/* 道具网格 */
.items-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:100px;margin-bottom:100px}
/* 道具格子 */
.item-slot{position:relative;width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.item-slot .slot-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.item-slot .item-img{position:absolute;inset:15px;width:calc(100% - 30px);height:calc(100% - 30px);object-fit:contain;display:block;z-index:2;pointer-events:none}
.item-slot .item-name{position:absolute;left:5px;top:20px;right:auto;text-align:left;font-size:30px;font-weight:bold;color:#ddd;text-shadow:0 2px 6px rgba(0,0,0,0.95),0 0 10px rgba(0,0,0,0.8);z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%;display:flex;align-items:center;gap:6px}
.item-slot .item-name .showcase-icon{width:30px;height:30px;object-fit:contain;flex-shrink:0}
.item-slot .item-prob{position:absolute;left:-40px;right:-40px;top:calc(105% + 36px);text-align:center;font-size:24px;font-weight:bold;z-index:3}
.item-slot .item-prob .prob-label{color:#ffd700;text-shadow:0 0 5px rgba(0,0,0,0.9)}
.item-slot .item-prob .prob-value{color:#000;text-shadow:0 0 3px #fff,0 0 6px #fff}
/* 关闭按钮 */
.close-btn{position:absolute;left:40px;top:30px;width:120px;height:120px;background:transparent;border:none;cursor:pointer;z-index:200}

/* 禁止长按查看图片/保存图片 */
img{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
/* 禁止全局右键菜单 */
*{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-img" src="../images/common/pages/reward/bg.png" alt="背景">
  <button class="close-btn" id="closeBtn"></button>
  <div class="scroll-container" id="scrollContainer">
    <!-- 道具列表由JS动态渲染 -->
  </div>
</div>

<script>
// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// 关闭按钮
document.getElementById('closeBtn').addEventListener('click', function(){
  window.parent.postMessage({type: 'closeReward'}, '*');
});

// ★ 道具盒子函数：根据道具名称获取图片路径
function getItemImage(itemName, type) {
  if(!itemName) return '';
  var timestamp = '?t=' + Date.now();
  // 1. 先查映射表（处理带 | 的特殊名称）
  if(window.ITEM_BASE_NAME_MAP && window.ITEM_BASE_NAME_MAP[itemName]){
    var baseName = window.ITEM_BASE_NAME_MAP[itemName];
    return '../images/items_box/' + baseName + '/' + type + '.png' + timestamp;
  }
  // 2. 再用正则去掉末尾的×数量
  var cleanName = itemName.replace(/[×*]\d+$/, '');
  return '../images/items_box/' + cleanName + '/' + type + '.png' + timestamp;
}

// 品质边框图片映射
var SLOT_BG_MAP = {
  'red': '../images/common/slot/red.png',
  'gold': '../images/common/slot/gold.png',
  'purple': '../images/common/slot/purple.png',
  'white': '../images/common/slot/white.png'
};


// ★ 奖池配置（按奖池分类，不按品质分类）
var POOL_CONFIG = [
  { name: '基础奖池', pool: window.GACHA_BASE_POOL || [] },
  { name: '额外加赠奖池', pool: window.BONUS_EXTRA_POOL || [] },
];



// 从概率表读取道具数据并渲染（按奖池分类）
function renderRewardList(){
  var container = document.getElementById('scrollContainer');
  var html = '';
  
  for(var p = 0; p < POOL_CONFIG.length; p++){
    var poolInfo = POOL_CONFIG[p];
    var pool = poolInfo.pool || [];
    var poolName = poolInfo.name || '';
    
    if(pool.length === 0) continue;
    
    // 奖池标题
    html += '<div class="quality-title gold">' + poolName + ' (' + pool.length + '个)</div>';
    
    // 道具网格
    html += '<div class="items-grid">';
    
    for(var j = 0; j < pool.length; j++){
      var item = pool[j];
      var itemImg = getItemImage(item.name, 'small');
      var itemName = item.name || '';
      var prob = item.prob || item.weight || 0;
      
      // 格式化概率
      var probText = prob + '%';
      if(typeof prob === 'number'){
        if(prob < 0.001){
          probText = prob.toFixed(4) + '%';
        }else if(prob < 0.01){
          probText = prob.toFixed(3) + '%';
        }else if(prob < 0.1){
          probText = prob.toFixed(2) + '%';
        }else{
          probText = prob.toFixed(1) + '%';
        }
      }
      
      // 判断是否有出货动画
      var hasShowcase = false;
      if(window.ITEM_BOX_CONFIG && window.ITEM_BOX_CONFIG[itemName]){
        hasShowcase = window.ITEM_BOX_CONFIG[itemName].has_showcase || false;
      }
      var nameHtml = '';
      if(hasShowcase){
        nameHtml = '<img class="showcase-icon" src="../images/common/showcase_icon.png">' + itemName;
      }else{
        nameHtml = itemName;
      }
      
      html += '<div class="item-slot quality-gold">';
      html += '<img class="slot-bg" src="../images/common/slot/gold.png">';
      html += '<img class="item-img" src="' + itemImg + '">';
      html += '<div class="item-name">' + nameHtml + '</div>';
      html += '<div class="item-prob"><span class="prob-label">概率：</span><span class="prob-value">' + probText + '</span></div>';
      html += '</div>';
    }
    
    html += '</div>';
  }
  
  if(html === ''){
    html = '<div style="color:#fff;font-size:36px;text-align:center;padding:100px;">暂无道具数据</div>';
  }
  
  container.innerHTML = html;
}

// 页面加载完成后渲染
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', renderRewardList);
}else{
  renderRewardList();
}
</script>

<script>
// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
